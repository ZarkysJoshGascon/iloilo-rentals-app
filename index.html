<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo-448.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2d568e" />
    <title>Iloilo Rentals · Condo stays and property management in Iloilo City</title>
    <meta name="description" content="Condo stays in Iloilo City, plus property management and interior design for owners. Units in Megaworld, Atria Park District and near the Iloilo River Esplanade." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Iloilo Rentals" />
    <meta property="og:title" content="Iloilo Rentals" />
    <meta property="og:description" content="Condo stays in Iloilo City, plus property management and interior design for owners." />
    <meta property="og:image" content="https://www.iloilorental.com/Iloilo_rentals_img.png" />
    <style>
      /* Shown until React starts; matches the loading screen in src/components/ui/preloader.tsx,
         which takes over without a visible change. */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; background: #fff; }
      .boot img { width: 112px; height: 112px; object-fit: contain; }
      .boot div { width: 192px; height: 4px; border-radius: 9999px; background: #f3f4f6; overflow: hidden; }
      .boot div span { display: block; width: 4%; height: 100%; border-radius: 9999px; background: #2d568e; }
      @media (min-width: 768px) {
        .boot img { width: 144px; height: 144px; }
        .boot div { width: 256px; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <img src="/logo-448.webp" alt="" />
        <div><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
